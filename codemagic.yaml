workflows:
  android-workflow:
    name: Alif Med - Android
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Force correct Gradle wrapper + AGP version + launcher icons
        script: |
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-bin.zip
          networkTimeout=10000
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          sed -i.bak "s/classpath 'com.android.tools.build:gradle:[^']*'/classpath 'com.android.tools.build:gradle:8.11.1'/" android/build.gradle
          sed -i.bak "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '2.2.20'/" android/build.gradle
          sed -i.bak "s/compileSdk [0-9]*/compileSdk 36/" android/app/build.gradle
          sed -i.bak "s/targetSdkVersion [0-9]*/targetSdkVersion 36/" android/app/build.gradle
          rm -f android/build.gradle.bak android/app/build.gradle.bak
          if [ -f android/gradlew ]; then
            sed -i.bak "s/DEFAULT_JVM_OPTS=.*/DEFAULT_JVM_OPTS=\"-Xmx64m -Xms64m\"/" android/gradlew
            rm -f android/gradlew.bak
            chmod +x android/gradlew
          fi
          if [ ! -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png ]; then
            mkdir -p android/app/src/main/res/mipmap-mdpi
            mkdir -p android/app/src/main/res/mipmap-hdpi
            mkdir -p android/app/src/main/res/mipmap-xhdpi
            mkdir -p android/app/src/main/res/mipmap-xxhdpi
            mkdir -p android/app/src/main/res/mipmap-xxxhdpi
            python3 -c "
from PIL import Image, ImageDraw
sizes = {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
for folder, size in sizes.items():
    img = Image.new('RGBA',(size,size),(244,247,245,255))
    d = ImageDraw.Draw(img)
    d.text((size*0.3,size*0.15), 'A', fill=(26,26,26,255))
    img.save(f'android/app/src/main/res/{folder}/ic_launcher.png')
" || echo "Skipping icon fallback (Pillow unavailable) - real icons should already be in the repo."
          fi
          cat android/gradle/wrapper/gradle-wrapper.properties
          grep classpath android/build.gradle
          grep compileSdk android/app/build.gradle
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
