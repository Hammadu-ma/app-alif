workflows:
  android-workflow:
    name: Alif Med - Android
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Force correct Gradle wrapper + AGP version
        script: |
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
          networkTimeout=10000
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          sed -i.bak "s/classpath 'com.android.tools.build:gradle:[^']*'/classpath 'com.android.tools.build:gradle:8.7.3'/" android/build.gradle
          sed -i.bak "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '2.1.0'/" android/build.gradle
          rm -f android/build.gradle.bak
          if [ -f android/gradlew ]; then
            sed -i.bak "s/DEFAULT_JVM_OPTS=.*/DEFAULT_JVM_OPTS=\"-Xmx64m -Xms64m\"/" android/gradlew
            rm -f android/gradlew.bak
            chmod +x android/gradlew
          fi
          cat android/gradle/wrapper/gradle-wrapper.properties
          grep classpath android/build.gradle
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
